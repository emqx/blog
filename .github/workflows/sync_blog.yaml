name: Sync Blog

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync_blog:
    runs-on: ubuntu-latest
    if: github.repository == 'emqx/blog'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Sync blogs
        run: |
          rm -rf en/*
          rm -rf zh/*
          rm -rf ja/*
          uv run .ci/sync_blog.py "$PWD"
          uv run .ci/generate_readme.py "$PWD"

      # Run even without changes so an obsolete sync PR can be closed.
      - name: Create or update sync pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GROWTH_CI_TOKEN }}
          branch: automation/sync-blogs
          base: main
          delete-branch: true
          commit-message: "sync blog"
          # Update Blog uses the author email to skip syncing back to admin.
          author: "emqx-ci-robot <ci@emqx.io>"
          committer: "emqx-ci-robot <ci@emqx.io>"
          add-paths: |
            en/
            zh/
            ja/
            README.md
            README-ZH.md
            README-JA.md
          title: "sync blogs"
          body: |
            Synchronize blog posts and indexes from the EMQX website.

            This pull request is updated by the Sync Blog workflow as new changes
            become available. Please submit manual edits in a separate pull request
            targeting main so they can be synced back to admin after merging.
          reviewers: "CrazyWisdom,Red-Asuka"
